[workspace]
members = ["crates/*", "bin/*"]
resolver = "2"

[workspace.dependencies]
time = { version = "0.3.44", features = [
    "serde",
    "std",
    "parsing",
    "macros",
    "formatting",
] }
chrono = "0.4.42"
sea-orm = { version = "2.0.0-rc", features = ["chrono", "seaography", "sqlx-mysql", "macros", "runtime-tokio-native-tls"] }
seaography = { version = "~2.0.0-rc.8", features = ["with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
r2d2 = "0.8.10"
mysql = { version = "25.0.1", default-features = false, features = ["minimal"] }
mysql_common = { version = "0.32.4", default-features = false, features = [
    "chrono",
    "derive",
    "bigdecimal",
] }
log = { version = "0.4.28", features = ["std"] }
axum = { version = "0.8.7", default-features = false, features = [
    "json",
    "tokio",
    "query",
    "http1",
] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
figment = { version = "0.10.19", default-features = false, features = ["yaml"] }
async-graphql = { version = "7.0.17", features = ["chrono"] }
async-graphql-axum = "7.0.17"
